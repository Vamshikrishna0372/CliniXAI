[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short

markers =
    unit: Fast deterministic unit tests (service, domain, calculation)
    integration: Integration tests exercising multiple components
    api: API contract and endpoint status code tests
    security: Security, authorization, and vulnerability tests
    concurrency: Concurrency, race condition, and atomic state tests
    persistence: Database persistence, restart durability, and snapshot safety
    ai: Deep learning and Grad-CAM explainability tests
    browser: Playwright headless browser E2E workflows
    smoke: Fast smoke tests for platform sanity
    regression: Comprehensive regression test suites

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning:multipart.*
    ignore:cannot collect 'test_rbac_router':pytest.PytestCollectionWarning
